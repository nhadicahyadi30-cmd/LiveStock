name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_livestock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_livestock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app_user:app_user_dev@localhost:5432/smart_livestock
      MIGRATION_DATABASE_URL: postgresql://migrator:migrator_dev@localhost:5432/smart_livestock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Ganti ke "pnpm install --frozen-lockfile" setelah pnpm-lock.yaml di-commit.
      - run: pnpm install

      - name: Buat role database
        run: psql "postgresql://postgres:postgres@localhost:5432/smart_livestock" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm db:rls
      - run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm test
